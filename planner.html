<!DOCTYPE html>
<html>
    <head>
        <title>planner</title>
    </head>
    <body>
        <h1>Planner</h1>
        <p>Task</p>
        <input id="task" placeholder="enter task">
        <button id="add">Add Task</button>
        <div id="taskList"></div>
        <button id="backBtn">← Back to Dashboard</button>
        <script>
            let tasks = [];
            function createTask(taskText)
            {
                let taskContainer = document.createElement("div");
                let p = document.createElement("p");
                p.innerText = taskText ;
                taskContainer.appendChild(p);
                let deleteBtn = document.createElement("button");
                deleteBtn.innerText = "Delete";
                taskContainer.appendChild(deleteBtn);
                document.getElementById("taskList").appendChild(taskContainer);
                deleteBtn.addEventListener("click", function()
                {
                    let index = tasks.indexOf(taskText);
                    tasks.splice(index, 1);
                    localStorage.setItem("tasks", JSON.stringify(tasks));
                    taskContainer.remove();
                    console.log(tasks);
                });
            }
            function addTask()
            {
                let taskText =document.getElementById("task").value;
                if(taskText=="")
                {
                    return;
                }
                tasks.push(taskText);
                localStorage.setItem("tasks", JSON.stringify(tasks));
                console.log(tasks);
                createTask(taskText);
                document.getElementById("task").value = "";
            }
            function back()
            {
                window.location.href='dashboard.html';
            }
            let savedTasks = localStorage.getItem("tasks");
            if(savedTasks)
            {
                tasks = JSON.parse(savedTasks);
            }
            for(let i=0;i<tasks.length;i++)
            {
                createTask(tasks[i])
            }
            document.getElementById("add").addEventListener("click", addTask);
            document.getElementById("backBtn").addEventListener("click", back);
        </script>
    </body>
</html>
