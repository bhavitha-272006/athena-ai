<!DOCTYPE html>
<html>
    <head>
        <title>planner</title>
        <style>
        .taskContainer
        {
            display: flex;
            gap: 20px;
            align-items: center;
            width: 250px;
        }
        .deleteBtn
        {
            margin-left: auto;
        }
    </style>
    </head>
    <body>
        
        <h1>Planner</h1>
        <p>Task</p>
        <input id="task" placeholder="enter task">
        <button id="add">Add Task</button>
        <div id="taskList"></div>
        <button id="backBtn">← Back to Dashboard</button>
        <script>
            let tasks = [];
            function createTask(task)
            {
                let taskContainer = document.createElement("div");
                taskContainer.className = "taskContainer";
                let checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                taskContainer.appendChild(checkbox);
                checkbox.checked = task.completed; 
                let p = document.createElement("span");
                p.innerText = task.text;
                taskContainer.appendChild(p);
                let deleteBtn = document.createElement("button");
                deleteBtn.innerText = "Delete";
                deleteBtn.className = "deleteBtn";
                taskContainer.appendChild(deleteBtn);
                deleteBtn.addEventListener("click", function()
                {
                    let index = tasks.indexOf(task);
                    tasks.splice(index, 1);
                    localStorage.setItem("tasks", JSON.stringify(tasks));
                    taskContainer.remove();
                    console.log(tasks);
                });
                checkbox.addEventListener("change", function()
                {
                    task.completed = checkbox.checked;
                    if(task.completed)
                    {
                        p.style.textDecoration = "line-through";
                    }
                    else
                    {
                        p.style.textDecoration = "none";
                    }
                    localStorage.setItem("tasks", JSON.stringify(tasks));
                });
                document.getElementById("taskList").appendChild(taskContainer);            
            }
            function addTask()
            {
                let taskText =document.getElementById("task").value;
                if(taskText=="")
                {
                    return;
                }
                tasks.push({
                    text: taskText,
                    completed: false
                });
                localStorage.setItem("tasks", JSON.stringify(tasks));
                console.log(tasks);
                createTask(tasks[tasks.length - 1]);
                document.getElementById("task").value = "";
                
            }
            function back()
            {
                window.location.href='dashboard.html';
            }
            let savedTasks = localStorage.getItem("tasks");
            if(savedTasks)
            {
                tasks = JSON.parse(savedTasks);
            }
            for(let i=0;i<tasks.length;i++)
            {
                createTask(tasks[i])
            }
            document.getElementById("add").addEventListener("click", addTask);
            document.getElementById("backBtn").addEventListener("click", back);
        </script>
    </body>
</html>
